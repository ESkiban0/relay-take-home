services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports: ["3000:3000"]
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    # Exec form, and node directly rather than through npm: with `npm start`,
    # PID 1 is npm, SIGTERM never reaches node, and the graceful shutdown in
    # src/index.ts is dead code. Verified — the handler never logged.
    command: ["node", "--import", "tsx", "src/index.ts"]
    restart: on-failure
    env_file: .env
    expose: ["3000"]
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules

  seed:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: ["node", "--import", "tsx", "docker/db/seed.ts"]
    restart: "no"
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: relay
    ports: ["3306:3306"]
    volumes:
      - ./docker/db/mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    expose: ["6379"]
    # The API refuses to start its broker and rate limiter against a Redis that
    # is not answering yet, so this gate is what makes `--scale api=3` boot
    # cleanly rather than crash-looping the first two instances.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
